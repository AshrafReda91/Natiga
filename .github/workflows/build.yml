name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk Natiga.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Natiga-apk
          path: Natiga.apk
      # نسخة للتحميل المباشر من الموبايل: releases/latest/download/Natiga.apk
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.${{ github.run_number }}
          name: النتيجة v1.${{ github.run_number }}
          files: Natiga.apk
          make_latest: true
